<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тренажёр: НОД и НОК</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    .task { font-size: 24px; margin: 20px 0; }
    input { font-size: 20px; width: 100px; padding: 5px; }
    button { font-size: 18px; padding: 8px 20px; margin-top: 10px; cursor: pointer; }
    .result { font-size: 20px; margin-top: 15px; }
    .correct { color: green; }
    .wrong { color: red; }
  </style>
</head>
<body>
  <h1>НОД и НОК</h1>
  <div class="task" id="task">Загрузка...</div>
  <input type="number" id="answer" placeholder="Ответ">
  <button onclick="check()">Проверить</button>
  <button onclick="next()">Дальше</button>
  <div class="result" id="result"></div>

  <script>
    let a, b, correctAnswer, mode;

    function gcd(x, y) {
      while (y) { [x, y] = [y, x % y]; }
      return x;
    }

    function next() {
      // Генерируем два числа от 2 до 30
      a = Math.floor(Math.random() * 29) + 2;
      b = Math.floor(Math.random() * 29) + 2;
      
      // Случайно выбираем: НОД или НОК
      mode = Math.random() < 0.5 ? 'НОД' : 'НОК';
      
      if (mode === 'НОД') {
        correctAnswer = gcd(a, b);
      } else {
        correctAnswer = (a * b) / gcd(a, b);
      }
      
      document.getElementById('task').textContent = 
        `Найдите ${mode}(${a}, ${b})`;
      document.getElementById('answer').value = '';
      document.getElementById('result').textContent = '';
      document.getElementById('answer').focus();
    }

    function check() {
      const userAnswer = parseInt(document.getElementById('answer').value);
      const resultEl = document.getElementById('result');
      
      if (userAnswer === correctAnswer) {
        resultEl.textContent = '✅ Верно!';
        resultEl.className = 'result correct';
      } else {
        resultEl.textContent = `❌ Неверно. Правильный ответ: ${correctAnswer}`;
        resultEl.className = 'result wrong';
      }
    }

    // Запуск
    next();
    
    // Проверка по Enter
    document.getElementById('answer').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') check();
    });
  </script>
</body>
</html>
