<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Теорема Виета</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 10px; }
    .progress { color: #666; font-size: 14px; margin-bottom: 20px; }
    .task { font-size: 26px; margin: 30px 0; font-family: monospace; }
    .answer-row { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
    input { font-size: 20px; padding: 8px; width: 220px; font-family: monospace; }
    button { font-size: 18px; padding: 8px 20px; cursor: pointer; }
    .feedback { font-size: 18px; margin-top: 10px; min-height: 24px; }
    .correct { color: green; }
    .wrong { color: red; }
    .final { font-size: 22px; margin-top: 30px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Теорема Виета</h1>
  <div class="progress" id="progress"></div>

  <div id="quiz">
    <div class="task" id="task"></div>
    <div class="answer-row">
      <input type="text" id="answer" placeholder="(x+a)(x+b)" autocomplete="off">
      <button onclick="check()">Проверить</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="final hidden" id="final"></div>

  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.js"></script>

  <script>
    const TOTAL = 20;
    let current = 0;
    let correct = 0;
    let tasks = [];

    function generateTask() {
      let a = Math.floor(Math.random() * 9) + 1;
      let b = Math.floor(Math.random() * 9) + 1;
      if (Math.random() < 0.5) a = -a;
      if (Math.random() < 0.5) b = -b;
      if (a === b) b = b === 9 ? 8 : b + 1;

      const type = Math.random() < 0.5 ? 1 : 2;

      if (type === 1) {
        const p = -(a + b);
        const q = a * b;
        const question = `x^2 ${fmt(p)}x ${fmt(q)}`;
        const answer = `(x ${fmt(-a)})(x ${fmt(-b)})`;
        return { question, answer };
      } else {
        let c = Math.floor(Math.random() * 9) + 1;
        let d = Math.floor(Math.random() * 9) + 1;
        if (Math.random() < 0.5) c = -c;
        if (Math.random() < 0.5) d = -d;
        if (c === d) d = d === 9 ? 8 : d + 1;

        const p2 = c + d;
        const q2 = -c * d;
        const question = `${fmt(q2)} ${fmt(p2)}x - x^2`;
        const target = `-x^2 + ${p2}*x + ${q2}`;
        const answerDisplay = `(${fmt(c)} - x)(x ${fmt(-d)})`;
        return { question, answer: answerDisplay, target };
      }
    }

    function fmt(n) {
      if (n === 0) return "";
      return n > 0 ? `+ ${n}` : `- ${Math.abs(n)}`;
    }

    function isEquivalent(userAnswer, task) {
      try {
        let user = userAnswer.replace(/\s+/g, '');
        user = user.replace(/²/g, '^2');

        let target;
        if (task.target) {
          target = task.target;
        } else {
          target = task.question.replace(/\s+/g, '');
        }

        const userSimplified = math.simplify(user).toString();
        const targetSimplified = math.simplify(target).toString();

        return userSimplified === targetSimplified;
      } catch (e) {
        return false;
      }
    }

    function generateSet() {
      const set = [];
      const used = new Set();
      let attempts = 0;
      while (set.length < TOTAL && attempts < 2000) {
        attempts++;
        const t = generateTask();
        const key = t.question + '|' + t.answer;
        if (used.has(key)) continue;
        used.add(key);
        set.push(t);
      }
      return set;
    }

    function start() {
      tasks = generateSet();
      current = 0;
      correct = 0;
      document.getElementById('quiz').classList.remove('hidden');
      document.getElementById('final').classList.add('hidden');
      showTask();
    }

    function showTask() {
      if (current >= TOTAL) { finish(); return; }
      const t = tasks[current];
      document.getElementById('task').textContent = t.question + ' = ?';
      document.getElementById('progress').textContent = `Вопрос ${current + 1} из ${TOTAL} · Правильных: ${correct}`;
      document.getElementById('answer').value = '';
      document.getElementById('feedback').textContent = '';
      document.getElementById('answer').focus();
    }

    function check() {
      const t = tasks[current];
      const userAnswer = document.getElementById('answer').value.trim();
      const fb = document.getElementById('feedback');
      if (!userAnswer) return;

      if (isEquivalent(userAnswer, t)) {
        correct++;
        fb.textContent = '✅ Верно!';
        fb.className = 'feedback correct';
        current++;
        setTimeout(() => {
          if (current >= TOTAL) finish();
          else showTask();
        }, 400);
      } else {
        fb.textContent = `❌ Неверно. Правильный ответ: ${t.answer}`;
        fb.className = 'feedback wrong';
      }
    }

    function finish() {
      document.getElementById('quiz').classList.add('hidden');
      const final = document.getElementById('final');
      final.classList.remove('hidden');
      const percent = Math.round((correct / TOTAL) * 100);
      final.innerHTML = `
        <h2>Набор завершён!</h2>
        <p>Правильных ответов: <b>${correct} из ${TOTAL}</b> (${percent}%)</p>
        <button onclick="start()">Новый набор</button>
      `;
    }

    document.getElementById('answer').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') check();
    });

    start();
  </script>
</body>
</html>
