<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сокращение дробей</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 10px; }
    .progress { color: #666; font-size: 14px; margin-bottom: 20px; }
    .task { font-size: 28px; margin: 30px 0; font-family: monospace; }
    .answer-row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; align-items: center; }
    .field label { font-size: 13px; color: #666; margin-bottom: 4px; }
    .field input { font-size: 20px; padding: 8px; width: 80px; font-family: monospace; text-align: center; }
    button { font-size: 18px; padding: 8px 20px; cursor: pointer; }
    .feedback { font-size: 18px; margin-top: 10px; min-height: 24px; }
    .correct { color: green; }
    .wrong { color: red; }
    .final { font-size: 22px; margin-top: 30px; }
    .hidden { display: none; }
    .fraction {
      display: inline-block;
      text-align: center;
      vertical-align: middle;
      margin: 0 4px;
    }
    .fraction .num {
      display: block;
      border-bottom: 2px solid #000;
      padding: 0 6px;
    }
    .fraction .den {
      display: block;
      padding: 0 6px;
    }
    .fraction-input {
      display: inline-block;
      text-align: center;
      vertical-align: middle;
    }
    .fraction-input input {
      display: block;
      width: 80px;
      text-align: center;
      border: none;
      border-bottom: 2px solid #000;
      padding: 4px;
      font-size: 20px;
      font-family: monospace;
      outline: none;
    }
    .fraction-input input:last-child {
      border-bottom: none;
    }
    .setup { margin: 30px 0; }
    .setup label { display: block; margin-bottom: 10px; font-size: 18px; }
    .setup select { font-size: 18px; padding: 8px; }
    .setup button { margin-top: 20px; font-size: 20px; padding: 10px 30px; }
    @media (max-width: 600px) {
  body {
    padding: 0 12px;
    margin: 20px auto;
  }
  h1 {
    font-size: 22px;
  }
  .task {
    font-size: 22px;
  }
  .answer-row {
    gap: 10px;
  }
  .field input,
  .fraction-input input {
    width: 60px;
    font-size: 18px;
    padding: 6px;
  }
  .fraction {
    font-size: 22px;
  }
  button {
    font-size: 16px;
    padding: 8px 16px;
  }
  .setup select {
    font-size: 16px;
    padding: 6px;
  }
  .setup button {
    font-size: 18px;
    padding: 10px 24px;
  }
  .final {
    font-size: 18px;
  }
      button {
    width: 100%;
    font-size: 20px;
    padding: 14px;
  }
}
  </style>
</head>
<body>
  <h1>Сокращение дробей</h1>

  <div class="setup" id="setup">
    <label>Количество вопросов в наборе:</label>
    <select id="totalSelect">
      <option value="10">10</option>
      <option value="20" selected>20</option>
      <option value="30">30</option>
      <option value="50">50</option>
    </select>
    <br>
    <button onclick="start()">Начать</button>
  </div>

  <div id="quiz" class="hidden">
    <div class="progress" id="progress"></div>
    <div class="task" id="task"></div>
    <div class="answer-row">
      <div class="field">
        <label>НОД</label>
        <input type="number" id="gcdInput" autocomplete="off">
      </div>
      <div class="fraction-input">
        <input type="number" id="numInput" autocomplete="off" placeholder="числ.">
        <input type="number" id="denInput" autocomplete="off" placeholder="знам.">
      </div>
      <button onclick="check()">Проверить</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="final hidden" id="final"></div>

  <script>
    let TOTAL = 20;
    let current = 0;
    let correct = 0;
    let tasks = [];

    function gcd(a, b) {
      while (b) { [a, b] = [b, a % b]; }
      return a;
    }

    function generateTask() {
      let a, b, g;
      do {
         if (Math.random() < 0.8) {
          a = Math.floor(Math.random() * 79) + 2;
          b = a + Math.floor(Math.random() * (80 - a)) + 1;
        } else {
          a = Math.floor(Math.random() * 79) + 2;
          b = Math.floor(Math.random() * 79) + 2;
        }
        g = gcd(a, b);
      } while (g === 1 || a === b);

      return {
        a, b,
        gcd: g,
        newNum: a / g,
        newDen: b / g
      };
    }

    function generateSet() {
      const set = [];
      const used = new Set();
      let attempts = 0;
      while (set.length < TOTAL && attempts < 5000) {
        attempts++;
        const t = generateTask();
        const key = t.a + '/' + t.b;
        if (used.has(key)) continue;
        used.add(key);
        set.push(t);
      }
      return set;
    }

    function start() {
      TOTAL = parseInt(document.getElementById('totalSelect').value);
      tasks = generateSet();
      current = 0;
      correct = 0;
      document.getElementById('setup').classList.add('hidden');
      document.getElementById('quiz').classList.remove('hidden');
      document.getElementById('final').classList.add('hidden');
      showTask();
    }

    function showTask() {
      if (current >= TOTAL) { finish(); return; }
      const t = tasks[current];
      document.getElementById('task').innerHTML = 
        `Сократите: <span class="fraction"><span class="num">${t.a}</span><span class="den">${t.b}</span></span>`;
      document.getElementById('progress').textContent = `Вопрос ${current + 1} из ${TOTAL} · Правильных: ${correct}`;
      document.getElementById('gcdInput').value = '';
      document.getElementById('numInput').value = '';
      document.getElementById('denInput').value = '';
      document.getElementById('feedback').textContent = '';
      document.getElementById('gcdInput').focus();
    }

    function check() {
      const t = tasks[current];
      const g = parseInt(document.getElementById('gcdInput').value);
      const n = parseInt(document.getElementById('numInput').value);
      const d = parseInt(document.getElementById('denInput').value);
      const fb = document.getElementById('feedback');

      if (isNaN(g) || isNaN(n) || isNaN(d)) return;

      const allCorrect = (g === t.gcd && n === t.newNum && d === t.newDen);

      if (allCorrect) {
        correct++;
        fb.innerHTML = '✅ Верно!';
        fb.className = 'feedback correct';
      } else {
        fb.innerHTML = `❌ Неверно. Правильно: НОД = ${t.gcd}, 
          <span class="fraction">
            <span class="num">${t.newNum}</span>
            <span class="den">${t.newDen}</span>
          </span>`;
        fb.className = 'feedback wrong';
      }

      current++;
      setTimeout(() => {
        if (current >= TOTAL) finish();
        else showTask();
      }, 700);
    }

    function finish() {
      document.getElementById('quiz').classList.add('hidden');
      const final = document.getElementById('final');
      final.classList.remove('hidden');
      const percent = Math.round((correct / TOTAL) * 100);
      final.innerHTML = `
        <h2>Набор завершён!</h2>
        <p>Правильных ответов: <b>${correct} из ${TOTAL}</b> (${percent}%)</p>
        <button onclick="reset()">Новый набор</button>
      `;
    }

    function reset() {
      document.getElementById('final').classList.add('hidden');
      document.getElementById('setup').classList.remove('hidden');
    }

    document.getElementById('gcdInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('numInput').focus();
      }
    });

    document.getElementById('numInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('denInput').focus();
      }
    });

    document.getElementById('denInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        check();
      }
    });
  </script>
</body>
</html>
